name: Try to Create OCI VM

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: oci-a1-flex-create
  cancel-in-progress: true

env:
  OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.IMAGE_ID }}
  OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: ${{ secrets.AD_NAME }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  create-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure OCI credentials
        shell: bash
        run: |
          set -euo pipefail
          required_vars=(
            OCI_COMPARTMENT_ID IMAGE_ID OCI_SUBNET_ID AD_NAME
            OCI_CLI_REGION OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT
            OCI_CLI_KEY_CONTENT SSH_PUBLIC_KEY
          )
          for name in "${required_vars[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Actions secret: $name"
              exit 1
            fi
          done

          mkdir -p ~/.oci
          printf "%s\n" "$OCI_CLI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_CLI_USER
          tenancy=$OCI_CLI_TENANCY
          fingerprint=$OCI_CLI_FINGERPRINT
          key_file=~/.oci/oci_api_key.pem
          region=$OCI_CLI_REGION
          EOF
          chmod 600 ~/.oci/config
          printf "%s\n" "$SSH_PUBLIC_KEY" > /tmp/oci_ssh_key.pub
          oci --version

      - name: Try to create A1.Flex VM
        id: create_vm
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          set +e
          OCI_OUTPUT=$(
            oci compute instance launch \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":4,"memoryInGBs":24}' \
              --subnet-id "$OCI_SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file /tmp/oci_ssh_key.pub \
              --assign-public-ip true \
              --display-name "coolify-vm" \
              --boot-volume-size-in-gbs 200 2>&1
          )
          status=$?
          set -e
          {
            echo "log_data<<EOF"
            echo "$OCI_OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## OCI VM launch attempt"
            echo
            echo "Exit code: $status"
            echo
            echo '```'
            echo "$OCI_OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$OCI_OUTPUT"
          if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            exit 0
          fi
          exit 1

      - name: Send Discord notification
        if: ${{ always() && env.DISCORD_WEBHOOK_URL != '' }}
        uses: sarisia/actions-status-discord@v1.15.4
        with:
          webhook: ${{ env.DISCORD_WEBHOOK_URL }}
          title: "OCI VM Status: ${{ steps.create_vm.outcome }}"
          status: ${{ steps.create_vm.outcome }}
          color: ${{ steps.create_vm.outcome == 'success' && '0x28a745' || '0xdc3545' }}
          description: |
            Attempt to create A1.Flex VM in ap-osaka-1.

            **Status:** `${{ steps.create_vm.outcome }}`

            **Log Output:**
            ```
            ${{ steps.create_vm.outputs.log_data }}
            ```

      - name: Fail workflow when VM was not created
        if: ${{ steps.create_vm.outcome != 'success' }}
        run: exit 1
